<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="Manoj Marianeason - Software Engineer and Python Developer Portfolio"
  />

  <title>Manoj Marianeason | Software Engineer</title>
</head>

<body>

  <!-- =====================================
       NETLIFY CONTACT FORM
       Netlify reads this during deployment.
  ====================================== -->

  <form
    name="contact"
    method="POST"
    data-netlify="true"
    data-netlify-honeypot="bot-field"
    hidden
  >

    <input type="hidden" name="form-name" value="contact">

    <p>
      <label>
        Name
        <input
          type="text"
          name="name"
        />
      </label>
    </p>

    <p>
      <label>
        Email
        <input
          type="email"
          name="email"
        />
      </label>
    </p>

    <p>
      <label>
        Subject
        <input
          type="text"
          name="subject"
        />
      </label>
    </p>

    <p>
      <label>
        Message
        <textarea
          name="message"
        ></textarea>
      </label>
    </p>

    <p>
      <label>
        Don't fill this out
        <input
          type="text"
          name="bot-field"
        />
      </label>
    </p>

  </form>


  <!-- React application -->
  <div id="root"></div>


  <script
    type="module"
    src="/src/main.jsx"
  ></script>

</body>

</html>
